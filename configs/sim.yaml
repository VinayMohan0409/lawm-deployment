# Simulated cell (MuJoCo stand-in). Same sections as real.yaml; only `cell` differs.
seed: 0
log_dir: runs

model:
  checkpoint: checkpoint/best.pt
  manifest: checkpoint/run_manifest.json
  prior: checkpoint/prior.npz

mount: {xyz_m: [0.0, 0.0, 0.0], rpy_deg: [0.0, 0.0, 0.0]}   # hand MJCF origin in the flange frame

cell:
  type: sim
  width: 848
  height: 480
  fovy_deg: 58.0
  noise_at_1m: 0.002        # depth noise std (m) at 1 m, grows with distance squared
  dropout: 0.02             # share of pixels with no depth
  home_deg: [180, -90, 90, -90, -90, 0]
  table: {x: 0.45, y: 0.1, half_x: 0.45, half_y: 0.6}
  objects:
    - {pos: [0.5, 0.15, 0.025], size: [0.05, 0.05, 0.05], mass: 0.1, rgba: [0.8, 0.2, 0.2, 1]}
    - {pos: [0.6, 0.35, 0.04], size: [0.04, 0.06, 0.08], mass: 0.1, rgba: [0.2, 0.3, 0.8, 1]}
  cameras:
    cam_left: {eye: [0.95, -0.45, 0.6], target: [0.5, 0.15, 0.05]}
    cam_right: {eye: [0.95, 0.75, 0.6], target: [0.5, 0.15, 0.05]}
  motion: {speed: 0.1, accel: 0.5, rot_speed: 0.5, finger_speed: 1.0, min_move_s: 0.3, finger_rate_hz: 100, settle_s: 0.2}

perception:
  near_m: 0.2
  far_m: 2.0
  use_box: true                    # crop to the workspace box (false: everything the cameras see within near..far)
  box_lo: [0.15, -0.35, -0.05]     # workspace box (m, base frame), fixed before any trial
  box_hi: [0.85, 0.65, 0.45]
  robot_margin_m: 0.015            # camera points this close to the arm/hand surface (FK) are dropped
  voxel_m: 0.015                   # one camera point per 1.5 cm voxel (PointWorld's grid)
  n_hand: 1024                     # Sharpa mesh points
  n_scene: 5120                    # camera points per frame: random subsample above, repeats below (6144 total fits an 11 GB GPU)
  min_scene_points: 500

safety:
  max_step_mm: 60.0         # lawm's DexWM value
  ori_alpha: 0.5            # lawm's DexWM value
  max_rot_deg: 30.0
  max_finger_deg: 60.0
  max_joint_deg: 30.0
  max_fit_residual_mm: 15.0
  box_lo: [0.15, -0.4, 0.05]   # flange target box (m)
  box_hi: [0.9, 0.7, 0.7]
  floor_z_m: 0.0             # no commanded hand point below this height (m, base frame)

# Planner: lawm's configs/stage3/dexwm.json, unchanged (reach and grasp; place needs object labels).
planner:
  cem:
    reach: {pop: 64, iters: 4, elite_frac: 0.2, min_std: 0.05, hold_candidate: true}
    grasp: {pop: 64, iters: 4, elite_frac: 0.2, min_std: 0.05, hold_candidate: true}
  weights:
    reach: {hand_scale: 1.0, fingertip: 2.0, object_still: 1.0}
    grasp: {hand_scale: 1.0, fingertip: 2.0}
  gates:
    hover: {margin_mm: 200.0, proximity_mm: 50.0, replan_cap: 40}

loop:
  reach: {max_replans: 80, converge_mm: 10.0, stall_patience: 15, stall_tol_mm: 0.05, max_holds: 5}
  grasp: {max_replans: 80, converge_mm: 10.0, stall_patience: null, stall_tol_mm: 0.05, max_holds: 5}
